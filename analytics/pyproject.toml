[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "florascope-core"
version = "3.0.1"
description = "FloraScope analytics: gap recovery, anomaly detection and EO processing"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy==2.3.5",
    "pandas==2.2.3",
    "scipy==1.17.0",
    "scikit-learn==1.8.0",
    "lightgbm==4.6.0",
    "joblib==1.5.3",
    "httpx==0.28.1",
    "rasterio==1.5.1",
    "shapely==2.1.2",
    "pyproj==3.7.2",
    "pillow==12.3.0"
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[project.scripts]
florascope-core = "florascope_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
