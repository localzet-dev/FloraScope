name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e './analytics[dev]' -e './backend[dev]'
      - run: python -m pytest -q analytics/tests backend/tests

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose run --rm api python -m pytest -q /app/analytics/tests /app/backend/tests
