name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            analytics/pyproject.toml
            backend/pyproject.toml
      - run: python -m pip install --upgrade 'pip==26.2.1'
      - run: pip install -e './analytics[dev]' -e './backend[dev]'
      - run: python -m pytest -q analytics/tests backend/tests

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose run --rm api python -m pytest -q /app/analytics/tests /app/backend/tests
